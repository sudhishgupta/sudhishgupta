name: Fold of the day

on:
  schedule:
    - cron: "7 0 * * *"  # 00:07 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fold-of-the-day
  cancel-in-progress: false

jobs:
  fold:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Draw today's protein
        run: python scripts/protein_hero.py --out assets/hero.svg --readme README.md

      - name: Commit if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          if git diff --cached --quiet; then
            echo "No change today"
          else
            git commit -m "Fold of the day: $(jq -r '.id + " " + .name' assets/hero.json)"
            git push
          fi
